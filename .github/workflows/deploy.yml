name: Deploy to GitHub Pages

# Push: fast deploy using feed JSON already in the repo.
# Schedule: scrape BookMyShow first, then build — no commits to main (avoids
# "fetch first" errors when you push while the cron is running).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 9 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refresh live feeds (scheduled / manual deploy only)
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run BookMyShow scraper
        if: github.event_name != 'push'
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install chromium
          python scraper/run.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: SPA fallback (deep links like /dine/kanak)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
