name: Refresh live feeds

# All times are UTC. The hotel is in Hyderabad (UTC+5:30), so:
#   09:30 UTC = 15:00 IST (refreshes after lunch service)
#   14:00 UTC = 19:30 IST (refreshes after dinner starts)
on:
  schedule:
    - cron: "0 */6 * * *"          # every 6 hours
    - cron: "30 9 * * *"           # post-lunch refresh (15:00 IST)
    - cron: "0 14 * * *"           # post-dinner refresh (19:30 IST)
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        env:
          # Optional: enables the Apify fallback for Instagram (free tier).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper/run.py

      - name: Commit refreshed feeds
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/feed/
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore: refresh live feeds"
            git push
          fi