name: Refresh live feeds

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        env:
          # Optional: enables the Apify fallback for Instagram (free tier).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper/run.py

      - name: Commit refreshed feeds
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/feed/
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "[skip ci] refresh live feeds"
            git push
          fi